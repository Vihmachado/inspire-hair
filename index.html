<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inspira Hair</title>
    <link rel="stylesheet" href="style.css"> 
    <script type="module" src="script.js"></script>
</head>
<body>

    <img src="img/top-right.svg" class="leaf leaf-top-right">
    <img src="img/bottom-left.svg" class="leaf leaf-bottom-left">

    <div class="page">
        <div id="cabecalho">
            <h1 class="title">VEJA SUA PRÓXIMA TRANSFORMAÇÃO EM VOCÊ</h1>
            <p class="subtitle">Experimente sua inspiração em tempo real e escolha com mais confiança.</p>
        </div>

        <div class="camera">
            <video id="camVideo" autoplay muted playsinline></video>
            <canvas id="outputCanvas"></canvas><!--O canvas é a camada que a IA vai utilizar para adicionar o filtro no vídeo-->
            <img id="camFallback" class="fallback-img" style="display:none;" alt="" src="">
           <!-- *No momento não utilizar o botão da câmera*
            <div class="btn-cam">
                <img src="img/Button.svg" alt="buttonCam">
            </div>
            --> 
            <p class="cam-text">Posicione seu rosto e cabelo<br>dentro da câmera.</p>
        </div>

        <p class="status-cam-text">Escolha uma inspiração para começar.</p>
        
        <div class="actions">
            <button class="btn-clear" type="button">LIMPAR</button>

            <label class="choose-img" tabindex="0">
                <input type="file" accept="image/*" id="img-insp"/>
                <span class="btn-main"><img src="img/sparkle.svg" alt="sparkleIcon" id="icon">ESCOLHER INSPIRAÇÃO</span>
            </label>

        </div>
    <footer>by @vihmachado.s</footer>
    </div>
</body>
</html>
